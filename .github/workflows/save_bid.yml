name: Save Bid

on:
  workflow_dispatch:
    inputs:
      buyer_name:
        description: 'Name of the bidder'
        required: true
      buyer_phone:
        description: 'Phone number of the bidder'
        required: true
      bid_amount:
        description: 'Bid amount in RUB'
        required: true

jobs:
  save-bid:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get current timestamp
      id: timestamp
      run: |
        echo "TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

    - name: Create bids directory
      run: |
        mkdir -p bids

    - name: Save bid data
      run: |
        cat > "bids/bid_${{ github.run_id }}_${{ github.run_attempt }}.json" << EOF
        {
          "id": "${{ github.run_id }}_${{ github.run_attempt }}",
          "buyer_name": "${{ github.event.inputs.buyer_name }}",
          "buyer_phone": "${{ github.event.inputs.buyer_phone }}",
          "bid_amount": ${!{ github.event.inputs.bid_amount }},
          "bid_date": "${{ env.TIMESTAMP }}",
          "status": "active"
        }
        EOF

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add bids/
        git commit -m "Add new bid from ${{ github.event.inputs.buyer_name }}" || echo "No changes to commit"
        git push